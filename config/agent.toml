[agent]
max_iterations = 30
max_consecutive_errors = 3
max_tool_calls = 50
max_identical_failures = 3

[model]
base_url = "http://127.0.0.1:8080/v1"
model = "Qwen3-Coder-30B-A3B-Instruct"
# Model picker IDs are read from the router INI sections (excluding [*]).
catalog_path = "config/llama-models.ini"
context_size = 32768
request_timeout_seconds = 300

[model.sampling]
temperature = 0.3
top_p = 0.8
top_k = 20
repeat_penalty = 1.05

[model.routes]
default = "coding-default"
large = "coding-large"
vision = "vision"
load_timeout_seconds = 300

[context]
profile = "default"

[storage]
database_path = "data/veyra.sqlite3"

[documents]
max_file_bytes = 26214400
max_uncompressed_bytes = 104857600
max_documents_per_request = 100
max_chunks_per_document = 10000
chunk_target_chars = 2000
chunk_overlap_chars = 200
default_search_limit = 10
max_search_limit = 50

[vision]
max_file_bytes = 10485760
max_images_per_request = 8
max_pixels_per_image = 16000000
max_total_pixels = 32000000
max_pdf_pages = 50
pdf_dpi = 144
render_timeout_seconds = 120
max_output_chars = 65536
pdftoppm_command = "pdftoppm"

[research]
searxng_base_url = "http://127.0.0.1:8888/"
request_timeout_seconds = 20
max_redirects = 5
max_response_bytes = 2097152
max_results = 10
user_agent = "Veyra/0.9"

[server]
bind = "127.0.0.1:3000"
allow_remote = false
frontend_directory = "frontend/dist"

[mcp]
connect_timeout_seconds = 30
call_timeout_seconds = 60
max_result_bytes = 1048576

[mcp.servers.playwright]
enabled = false
kind = "playwright"
command = "npx"
args = ["-y", "@playwright/mcp@0.0.80", "--headless", "--output-dir", ".veyra/browser"]
pass_env = []

[security]
workspace_root = "workspace"

[tools]
command_timeout_seconds = 120
stdout_limit_bytes = 1048576
stderr_limit_bytes = 1048576
file_read_limit_bytes = 2097152
search_result_limit = 500

[tools.command_profiles.cargo_build]
timeout_seconds = 300
stdout_limit_bytes = 2097152
stderr_limit_bytes = 2097152

[tools.command_profiles.cargo_test]
timeout_seconds = 600
stdout_limit_bytes = 2097152
stderr_limit_bytes = 2097152

[tools.command_profiles.git]
timeout_seconds = 60
stdout_limit_bytes = 1048576
stderr_limit_bytes = 1048576

[logging]
level = "info"
directory = "logs"
