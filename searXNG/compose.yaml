name: veyra-searxng

services:
  searxng:
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-2026.8.20-8d3dd0cd4}
    container_name: veyra-searxng
    restart: unless-stopped
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - "${SEARXNG_HOST:-127.0.0.1}:${SEARXNG_PORT:-8888}:8080"
    environment:
      FORCE_OWNERSHIP: "false"
      SEARXNG_BASE_URL: "http://${SEARXNG_HOST:-127.0.0.1}:${SEARXNG_PORT:-8888}/"
      SEARXNG_SECRET: "${SEARXNG_SECRET:?Run setup.ps1 before starting the stack}"
      SEARXNG_VALKEY_URL: "valkey://valkey:6379/0"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  valkey:
    image: docker.io/valkey/valkey:${VALKEY_VERSION:-9.1.2-alpine3.24}
    container_name: veyra-searxng-valkey
    restart: unless-stopped
    command:
      - valkey-server
      - --save
      - "30"
      - "1"
      - --loglevel
      - warning
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

volumes:
  searxng-cache:
  valkey-data:
