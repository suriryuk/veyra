[workspace]
resolver = "2"
members = [
    "apps/agent-cli",
    "crates/agent-context",
    "crates/agent-core",
    "crates/agent-mcp",
    "crates/agent-model",
    "crates/agent-research",
    "crates/agent-security",
    "crates/agent-storage",
    "crates/agent-tools",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
diffy = "0.4"
eventsource-stream = "0.2"
encoding_rs = "0.8"
futures-util = "0.3"
globset = "0.4"
hex = "0.4"
regex = "1"
rmcp = { version = "3.2", default-features = false, features = ["client", "transport-child-process"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
scraper = "0.22"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
